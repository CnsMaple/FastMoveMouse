# MinGW-w64 is required: the build is pinned to the GNU target.
#
# Two reasons:
#  * this keeps the linker out of the hands of the MSVC toolchain, so the build
#    is identical for everyone;
#  * Git for Windows ships its own "link.exe", which shadows the MSVC linker and
#    makes linking fail with "extra operand".
#
# Requires the GNU toolchain, for example:
#     rustup default stable-x86_64-pc-windows-gnu
# and a MinGW-w64 gcc on PATH. Set the linker below to an absolute path if gcc
# is not on PATH.
[build]
target = "x86_64-pc-windows-gnu"

[target.x86_64-pc-windows-gnu]
linker = "gcc"
